spring:
  application:
    name: planeta-atlantida-rbs

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/db-planeta_atlantida}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite

  jackson:
    mapper:
      accept-case-insensitive-enums: true

app:
  storage:
    documentos:
      path: ${DOCUMENTOS_PATH:./storage/documentos}
  seed:
    admin:
      ativo: ${SEED_ADMIN:true}
      nome: ${SEED_ADMIN_NOME:Admin de desenvolvimento}
      email: ${SEED_ADMIN_EMAIL:admin@planeta.dev}
      senha: ${SEED_ADMIN_SENHA:admin123}

server:
  port: 8080
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public:
    key: classpath:authz.pub
  private:
    key: classpath:authz.pem

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.orm.jdbc.extract: TRACE