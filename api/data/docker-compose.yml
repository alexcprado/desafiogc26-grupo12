version: "3.7"
name: db_desafio_gc
services:
  postgres:
    image: postgres:14
    container_name: db_desafio_gc
    restart: always
    environment:
      POSTGRES_DB: db-planeta_atlantida
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts:/docker-entrypoint-initdb.d:ro
volumes:
  postgres-data:
  pgadmin-data:
